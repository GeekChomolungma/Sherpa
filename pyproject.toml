[project]
name = "sherpa"
version = "0.1.0"
description = "Sherpa: Data-to-Signal strategy engine (data feed / feature / strategy layers)"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "redis>=5.0",
    "clickhouse-connect>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]
# 机器学习 alpha（sherpa/alpha/custom/ml/）：推断和 research/ml_training/ 的训练都要。`pip install -e .[ml]`
ml = [
    "lightgbm>=4.0",
    "xgboost>=2.0",
]
# 神经网络后端（LSTM，sherpa/alpha/custom/ml/backends/lstm.py）：默认用 GPU 训练，要装 CUDA 版 torch（不要装 CPU 版）：
#   pip install torch --index-url https://download.pytorch.org/whl/cu130   （RTX 50 系 / Blackwell 至少要 cu128）
# 没有 GPU 的机器才在模型的 backend_params 里显式写 device="cpu"。
nn = [
    "torch>=2.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sherpa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
